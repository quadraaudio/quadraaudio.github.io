<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e5e5ea" />
    </linearGradient>
  </defs>

  <!-- Apple Squircle Container (rx=108 for 512x512) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8" />

  <!-- Quadra Audio Icon Symbol -->
  <g transform="translate(136, 136)" fill="url(#symbolGrad)">
    <rect x="0" y="0" width="240" height="240" rx="48" fill="none" stroke="url(#symbolGrad)" stroke-width="28" />
    <circle cx="120" cy="120" r="36" fill="url(#symbolGrad)" />
  </g>
</svg>
